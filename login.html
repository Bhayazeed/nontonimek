<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Nontonimek</title>
    <meta name="description"
        content="Masuk ke akun Nontonimek untuk mulai menikmati berbagai tontonan anime favoritmu.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
</head>

<body class="text-white" style="background-color: #0b0c2a;">
    <main id="anime-login-section"
        class="min-vh-100 d-flex align-items-center justify-content-center anime-login-section">
        <div class="container anime-login-container">
            <div class="row justify-content-center anime-login-row">
                <div class="col-12 col-md-6 col-lg-4 anime-login-col">
                    <div id="anime-login-card"
                        class="anime-login-box bg-dark bg-opacity-50 p-5 rounded shadow-sm border border-secondary border-opacity-25 anime-login-card">
                        <h1 class="h3 text-white text-start mb-4 anime-login-title">Masuk</h1>
                        <form id="anime-login-form" class="anime-login-form">
                            <div class="mb-3 anime-form-group">
                                <label for="anime-input-email" class="form-label anime-form-label">Email</label>
                                <input type="email" class="form-control text-bg-dark border-secondary anime-form-input"
                                    id="anime-input-email" aria-describedby="emailHelp">
                            </div>
                            <div class="mb-3 anime-form-group">
                                <div class="d-flex justify-content-between mb-1 anime-password-label-group">
                                    <label for="anime-input-password"
                                        class="form-label mb-0 text-white anime-form-label">Password</label>
                                    <a id="anime-forgot-password-link" href="#"
                                        class="text-decoration-none text-white text-opacity-75 anime-forgot-pwd"
                                        style="font-size: 0.85rem;">Lupa
                                        Password?</a>
                                </div>
                                <input type="password"
                                    class="form-control text-bg-dark border-secondary anime-form-input"
                                    id="anime-input-password">
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4 anime-form-actions">
                                <div class="form-check anime-form-check">
                                    <input class="form-check-input border-secondary anime-check-input" type="checkbox"
                                        id="anime-check-remember">
                                    <label class="form-check-label text-white anime-check-label"
                                        for="anime-check-remember" style="font-size: 0.9rem;">Ingat Saya</label>
                                </div>
                                <button id="anime-login-submit-btn" type="submit"
                                    class="btn btn-primary px-3 fw-semibold anime-submit-btn">Masuk</button>
                            </div>
                        </form>
                        <div class="border-top border-secondary pt-3 mt-4 text-center anime-register-prompt">
                            <p class="anime-register-text">Belum punya akun? <a id="anime-register-link"
                                    class="text-white anime-register-link" href="signup.html">Daftar di sini</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
